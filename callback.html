<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health All-In — Connecting Strava…</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'DM Sans', sans-serif;
    background: #0a0a0f;
    color: #f0f0f5;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    flex-direction: column;
    gap: 16px;
    padding: 24px;
    text-align: center;
  }
  .icon { font-size: 48px; }
  h2 { font-size: 22px; font-weight: 600; }
  p  { font-size: 14px; color: #8888a0; line-height: 1.6; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #1a1a24;
    border-top-color: #fc4c02;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #ff6b6b; }
  .success { color: #7fff6e; }
</style>
</head>
<body>

<div class="icon" id="icon">🟠</div>
<h2 id="heading">Connecting Strava…</h2>
<div class="spinner" id="spinner"></div>
<p id="msg">Exchanging authorisation code…</p>

<script>
  // Read params from URL
  const params   = new URLSearchParams(window.location.search);
  const code     = params.get('code');
  const error    = params.get('error');
  // Read script URL from localStorage, with hardcoded fallback
  const FALLBACK_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzvwnZqd7hOVgkMLoFdtnOXTntOdbZkRJfFiDMIIGNuOmbWB7bWr4q4u82mk9U4T-I8fQ/exec';
  const scriptUrl = localStorage.getItem('hai_script_url') ||
                    sessionStorage.getItem('hai_script_url') ||
                    FALLBACK_SCRIPT_URL;

  function showError(msg) {
    document.getElementById('icon').textContent    = '❌';
    document.getElementById('heading').textContent = 'Connection failed';
    document.getElementById('heading').className   = 'error';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').textContent     = msg;
  }

  function showSuccess(name) {
    document.getElementById('icon').textContent    = '✅';
    document.getElementById('heading').textContent = 'Strava Connected!';
    document.getElementById('heading').className   = 'success';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').textContent     = 'Welcome, ' + name + '! This window will close automatically.';
    setTimeout(() => window.close(), 2000);
  }

  async function exchangeCode() {
    if (error) { showError('Strava returned an error: ' + error); return; }
    if (!code)  { showError('No authorisation code received from Strava.'); return; }
    if (!scriptUrl) {
      showError('Apps Script URL not found. Please go back to the app and try again.');
      return;
    }

    // Send the code to Apps Script via JSONP (bypasses CORS)
    try {
      const result = await jsonp(scriptUrl + '?action=stravaexchange&code=' + encodeURIComponent(code));
      if (result.ok) {
        showSuccess(result.athlete_name || 'athlete');
        // Signal to the opener window that connection succeeded
        if (window.opener) {
          window.opener.postMessage({ type: 'strava_connected', athlete: result.athlete_name }, '*');
        }
      } else {
        showError(result.error || 'Token exchange failed. Check Apps Script logs.');
      }
    } catch(e) {
      showError('Could not reach Apps Script: ' + e.message);
    }
  }

  function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cbName = 'strava_cb_' + Date.now();
      const script  = document.createElement('script');
      const timeout = setTimeout(() => {
        cleanup(); reject(new Error('Timeout — Apps Script did not respond'));
      }, 15000);
      window[cbName] = (data) => { cleanup(); resolve(data); };
      function cleanup() {
        clearTimeout(timeout);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      const sep = url.includes('?') ? '&' : '?';
      script.src = url + sep + 'callback=' + cbName;
      script.onerror = () => { cleanup(); reject(new Error('Script load failed')); };
      document.head.appendChild(script);
    });
  }

  exchangeCode();
</script>
</body>
</html>
